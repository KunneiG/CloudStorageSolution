{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Облако{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'storage/css/style.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'file_list' %}" class="logo">☁️ Моё облако</a>
        <nav>
            {% if user.is_authenticated %}
            <a href="{% url 'upload' %}">Загрузить</a>
            <span>Привет, {{ user.username }}</span>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
            {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2026 Облачное хранилище. Учебный проект.</p>
    </footer>
</body>
</html>
