{% extends 'storage/base.html' %}
{% block content %}
<h1>Удалить файл?</h1>
<p>Вы уверены, что хотите удалить "{{ file.title|default:file.file.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" style="background: red; color: white;">Да, удалить</button>
    <a href="{% url 'file_list' %}">Отмена</a>
</form>
{% endblock %}
